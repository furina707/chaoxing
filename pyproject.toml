[project]
name = "chaoxing"
version = "3.1.3"
description = "超星学习通/超星尔雅/泛雅超星全自动无人值守完成任务点"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.15,<4.0"
dynamic = ["dependencies"]

[project.optional-dependencies]
# 自动验证码识别（OCR）可选依赖：项目内置 ONNX 模型与字符集，
# 使用 torch 后端推理，不依赖 ddddocr / onnxruntime。
# 启用方式：pip install ".[ocr]"
ocr = [
    "torch>=2.5",
    "onnx>=1.16",
    "onnx2torch>=1.5",
    "Pillow",
    "numpy",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}
